<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | DZD Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">DZD<span>Store</span></a><a class="cart" href="index.html">← المتجر</a></div></header><main class="container section"><div class="checkout-grid"><section class="checkout-card"><span class="badge">طلب آمن</span><h1>إتمام الطلب</h1><p>أدخل معلوماتك لإصدار رقم طلب. الدفع الإلكتروني سيُفعّل عند إضافة بيانات التاجر ومفتاح بوابة الدفع.</p><form id="orderForm"><label>الاسم الكامل<input required name="name" placeholder="اسمك الكامل"></label><label>البريد الإلكتروني<input required type="email" name="email" placeholder="example@email.com"></label><label>رقم الهاتف<input required name="phone" inputmode="tel" placeholder="05 xx xx xx xx"></label><label>طريقة الدفع<select name="payment"><option value="pending">الدفع الإلكتروني — قيد الربط</option><option value="manual">تحويل/دفع يدوي</option></select></label><button class="primary full" type="submit">إنشاء الطلب</button></form><div id="success" class="success"></div></section><aside class="checkout-card"><h2>ملخص الطلب</h2><div id="summary"></div><div class="total">المجموع <b id="total">0 دج</b></div></aside></div></main><script>
const cart=JSON.parse(localStorage.getItem('dzd-cart')||'[]');const money=n=>Number(n).toLocaleString('ar-DZ')+' دج';const summary=document.getElementById('summary');const total=cart.reduce((s,p)=>s+Number(p.price),0);summary.innerHTML=cart.length?cart.map(p=>`<div class="cart-row"><span>${p.icon} ${p.name}</span><b>${money(p.price)}</b></div>`).join(''):'<div class="empty">السلة فارغة. <a href="index.html">تصفح المنتجات</a></div>';document.getElementById('total').textContent=money(total);
document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();if(!cart.length)return;const data=new FormData(e.target);const order={id:'DZD-'+Date.now().toString(36).toUpperCase(),createdAt:new Date().toISOString(),customer:{name:data.get('name'),email:data.get('email'),phone:data.get('phone')},payment:data.get('payment'),status:'PENDING',items:cart,total};const orders=JSON.parse(localStorage.getItem('dzd-orders-list')||'[]');orders.unshift(order);localStorage.setItem('dzd-orders-list',JSON.stringify(orders));localStorage.setItem('dzd-orders',String(orders.length));localStorage.removeItem('dzd-cart');document.getElementById('success').innerHTML=`✅ تم إنشاء الطلب <strong>${order.id}</strong><br>الحالة: قيد الدفع. احتفظ برقم الطلب.`;e.target.reset();};
</script></body></html>
