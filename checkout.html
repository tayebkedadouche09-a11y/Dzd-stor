<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | DZD Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">DZD<span>Store</span></a><a class="cart" href="index.html">← المتجر</a></div></header><main class="container section"><div class="checkout-grid"><section class="checkout-card"><span class="badge">دفع آمن</span><h1>إتمام الطلب</h1><p>الدفع يتم عبر صفحة Chargily الآمنة، وتأكيد الدفع يتم من الخادم عبر webhook موثوق.</p><form id="orderForm"><label>الاسم الكامل<input required name="name" maxlength="120" autocomplete="name" placeholder="اسمك الكامل"></label><label>البريد الإلكتروني<input required type="email" name="email" maxlength="160" autocomplete="email" placeholder="example@email.com"></label><label>رقم الهاتف<input required name="phone" maxlength="30" inputmode="tel" autocomplete="tel" placeholder="05 xx xx xx xx"></label><button class="primary full" type="submit">الدفع الآن — CIB / EDAHABIA</button></form><div id="success" class="success"></div></section><aside class="checkout-card"><h2>ملخص الطلب</h2><div id="summary"></div><div class="total">المجموع <b id="total">0 دج</b></div></aside></div></main><script src="supabase-config.js"></script><script>
const cart=JSON.parse(localStorage.getItem('dzd-cart')||'[]');const money=n=>Number(n).toLocaleString('ar-DZ')+' دج';const summary=document.getElementById('summary');const total=cart.reduce((s,p)=>s+Number(p.price||0),0);summary.innerHTML=cart.length?cart.map(p=>`<div class="cart-row"><span>${p.icon||'📦'} ${p.name}</span><b>${money(p.price)}</b></div>`).join(''):'<div class="empty">السلة فارغة. <a href="index.html">تصفح المنتجات</a></div>';document.getElementById('total').textContent=money(total);const cfg=window.DZD_SUPABASE;const q=new URLSearchParams(location.search);
async function showDownloads(){const orderId=q.get('order_id'),last=JSON.parse(localStorage.getItem('dzd-last-order')||'null');if(!orderId||!last?.email)return;const box=document.getElementById('success');box.innerHTML='⏳ تم الدفع، نتحقق من تأكيد العملية ونجهز ملفاتك…';for(let n=0;n<10;n++){try{const r=await fetch(`${cfg.url}/functions/v1/download-links`,{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.key,Authorization:`Bearer ${cfg.key}`},body:JSON.stringify({order_id:orderId,email:last.email})});const out=await r.json();if(r.ok&&out.links?.length){box.innerHTML='✅ تم تأكيد الدفع للطلب <strong>'+out.order_code+'</strong><br><br>'+out.links.map(x=>`<a class="primary" style="display:block;margin:8px 0" href="downloads.html?token=${encodeURIComponent(x.token)}">📥 تحميل ${x.product_name}</a>`).join('');return}}catch(_){}await new Promise(r=>setTimeout(r,3000))}box.innerHTML='⏳ الدفع تم إرساله، لكن تأكيد البنك مازال قيد المعالجة. أعد فتح هذه الصفحة بعد لحظات.'}
if(q.get('paid')==='1')showDownloads();if(q.get('paid')==='0')document.getElementById('success').textContent='⚠️ لم يكتمل الدفع. يمكنك المحاولة مرة أخرى.';
document.getElementById('orderForm').onsubmit=async e=>{e.preventDefault();if(!cart.length)return;const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='جاري تجهيز الدفع…';document.getElementById('success').textContent='';try{const data=new FormData(e.target);const items=cart.map(p=>({product_id:Number(p.id),quantity:Number(p.quantity||1)}));if(!cfg)throw new Error('إعداد المتجر غير متوفر');const email=String(data.get('email')).trim().toLowerCase();const r=await fetch(`${cfg.url}/functions/v1/create-order`,{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.key,Authorization:`Bearer ${cfg.key}`},body:JSON.stringify({name:data.get('name'),email,phone:data.get('phone'),payment_method:'chargily',site_url:location.origin,items})});const out=await r.json().catch(()=>({}));if(!r.ok)throw new Error(out.error||'تعذر إنشاء صفحة الدفع');if(!out.checkout_url)throw new Error('لم يتم إنشاء رابط الدفع');localStorage.setItem('dzd-last-order',JSON.stringify({order_id:out.order_id,email}));localStorage.removeItem('dzd-cart');location.href=out.checkout_url;}catch(err){document.getElementById('success').textContent='❌ '+err.message;btn.disabled=false;btn.textContent='الدفع الآن — CIB / EDAHABIA'}};
</script></body></html>
