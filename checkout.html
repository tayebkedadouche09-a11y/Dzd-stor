<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إتمام الطلب | DZD Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">DZD<span>Store</span></a><a class="cart" href="index.html">← المتجر</a></div></header><main class="container section"><div class="checkout-grid"><section class="checkout-card"><span class="badge">المرحلة التجريبية</span><h1>إتمام الطلب</h1><p>أدخل معلوماتك. الدفع الإلكتروني سيتم ربطه في المرحلة القادمة.</p><form id="orderForm"><label>الاسم الكامل<input required name="name" placeholder="اسمك الكامل"></label><label>البريد الإلكتروني<input required type="email" name="email" placeholder="example@email.com"></label><label>رقم الهاتف<input required name="phone" placeholder="05 xx xx xx xx"></label><button class="primary full" type="submit">تأكيد الطلب</button></form><div id="success" class="success"></div></section><aside class="checkout-card"><h2>ملخص الطلب</h2><div id="summary"></div><div class="total">المجموع <b id="total">0 دج</b></div></aside></div></main><script>const cart=JSON.parse(localStorage.getItem('dzd-cart')||'[]'),money=n=>n.toLocaleString('ar-DZ')+' دج';const summary=document.getElementById('summary');const total=cart.reduce((s,p)=>s+p.price,0);summary.innerHTML=cart.length?cart.map(p=>`<div class="cart-row"><span>${p.icon} ${p.name}</span><b>${money(p.price)}</b></div>`).join(''):'<div class="empty">السلة فارغة. <a href="index.html">تصفح المنتجات</a></div>';document.getElementById('total').textContent=money(total);document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();if(!cart.length)return;document.getElementById('success').innerHTML='✅ تم تسجيل طلبك تجريبياً. عند ربط الدفع سيتم تحويلك تلقائياً إلى بوابة الدفع.';e.target.reset()};</script></body></html>
