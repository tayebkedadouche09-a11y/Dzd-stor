<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفاصيل المنتج | DZD Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">DZD<span>Store</span></a><nav><a href="index.html#products">المنتجات</a><a href="index.html#categories">الأقسام</a></nav><a class="cart" href="index.html">← المتجر</a></div></header><main class="container section"><div id="productDetails"></div></main><script>const defaults=[{id:1,name:'التاجر الذكي AI',desc:'100 Prompt احترافي للتجارة والتسويق بالعربية',price:1490,cat:'prompts',icon:'🤖',features:['100 Prompt جاهز للاستعمال','مخصص للتجارة والتسويق','باللغة العربية','ملف PDF مرتب وسهل الاستخدام']},{id:2,name:'Social Media Templates',desc:'قوالب جاهزة لمنشورات Instagram وFacebook',price:1990,cat:'templates',icon:'🎨',features:['قوالب قابلة للتعديل','مناسبة لـ Instagram وFacebook','تصميمات متعددة','جاهزة للنشر']},{id:3,name:'WhatsApp Sales Kit',desc:'رسائل وقوالب جاهزة لرفع المبيعات عبر واتساب',price:1790,cat:'kits',icon:'💬',features:['رسائل بيع جاهزة','ردود على العملاء','متابعة العملاء','سيناريوهات إقناع']},{id:4,name:'Business Excel Kit',desc:'ملفات Excel لتنظيم المبيعات والمصاريف والأرباح',price:2490,cat:'tools',icon:'📊',features:['متابعة المبيعات','حساب الأرباح','تسجيل المصاريف','نماذج جاهزة']},{id:5,name:'Freelancer AI Kit',desc:'حزمة أدوات وPrompts للعمل الحر بذكاء',price:2990,cat:'kits',icon:'💼',features:['Prompts للعمل الحر','تحسين عروض الخدمات','تنظيم المشاريع','رفع الإنتاجية']},{id:6,name:'Content Calendar',desc:'تقويم محتوى جاهز لمدة 30 يوماً',price:990,cat:'templates',icon:'📅',features:['30 يوم محتوى','أفكار منشورات','تنظيم أسبوعي','مناسب للشبكات الاجتماعية']}];const products=JSON.parse(localStorage.getItem('dzd-products')||'null')||defaults;const id=Number(new URLSearchParams(location.search).get('id')||1),p=products.find(x=>x.id===id)||products[0],money=n=>Number(n).toLocaleString('ar-DZ')+' دج';document.title=p.name+' | DZD Store';document.getElementById('productDetails').innerHTML=`<div class="product-detail"><div class="hero-card"><div class="orb">${p.icon}</div><h3>${p.name}</h3><p>${p.desc}</p></div><div class="detail-copy"><span class="badge">منتج رقمي</span><h1>${p.name}</h1><p class="lead">${p.desc}</p><h2>${money(p.price)}</h2><h3>ماذا ستحصل عليه؟</h3><ul>${(p.features||['منتج رقمي جاهز للاستعمال','تحميل بعد تأكيد الدفع']).map(x=>`<li>✓ ${x}</li>`).join('')}</ul><button class="primary" onclick="buy()">اشترِ الآن</button></div></div>`;function buy(){const cart=JSON.parse(localStorage.getItem('dzd-cart')||'[]');if(!cart.some(x=>x.id===p.id))cart.push(p);localStorage.setItem('dzd-cart',JSON.stringify(cart));location.href='checkout.html'}</script></body></html>
