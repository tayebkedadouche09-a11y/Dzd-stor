<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحميل المنتج | DZD Store</title><link rel="stylesheet" href="styles.css"></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">DZD<span>Store</span></a><a class="cart" href="index.html">← المتجر</a></div></header><main class="container section"><section class="checkout-card" style="max-width:720px;margin:auto;text-align:center"><span class="badge">تحميل آمن</span><h1>ملفات طلبك</h1><p id="message">يتم التحقق من صلاحية التحميل…</p><div id="downloadArea"></div></section></main><script src="supabase-config.js"></script><script>
const token=new URLSearchParams(location.search).get('token');const area=document.getElementById('downloadArea');const message=document.getElementById('message');const cfg=window.DZD_SUPABASE;
async function load(){if(!token){message.textContent='رابط التحميل ناقص.';return}if(!cfg){message.textContent='إعداد المتجر غير متوفر.';return}try{const r=await fetch(`${cfg.url}/functions/v1/download-product`,{method:'POST',headers:{'Content-Type':'application/json',apikey:cfg.key,Authorization:`Bearer ${cfg.key}`},body:JSON.stringify({token})});const data=await r.json();if(!r.ok)throw new Error(data.error||'تعذر إنشاء رابط التحميل');area.innerHTML=`<a class="primary" href="${data.url}">📥 تحميل المنتج</a><p class="muted">الرابط المؤقت صالح لمدة ${Math.round(data.expires_in/60)} دقائق.</p>`;message.textContent='تم التحقق من الدفع ويمكنك التحميل الآن.'}catch(e){message.textContent=e.message}}load();
</script></body></html>
