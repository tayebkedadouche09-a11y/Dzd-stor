<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DZD Store — Admin</title><link rel="stylesheet" href="styles.css">
<style>.admin{max-width:1100px;margin:30px auto;padding:0 16px}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.admin-card,.admin-form{background:#fff;border:1px solid #e7e7e7;border-radius:16px;padding:20px;box-shadow:0 8px 24px #00000008}.admin-card strong{font-size:28px;display:block;margin-top:8px}.admin-form{margin-top:20px}.admin-form label{display:block;margin:12px 0 6px;font-weight:700}.admin-form input,.admin-form select,.admin-form textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit;box-sizing:border-box}.admin-form button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:700}.admin-list{margin-top:20px}.admin-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.danger{background:#ffe9e9;color:#a00}.primary{background:#111;color:#fff}.muted{color:#777}</style>
</head>
<body>
<header class="site-header"><div class="container"><a class="logo" href="index.html">DZD Store</a><a href="index.html">← المتجر</a></div></header>
<main class="admin"><h1>لوحة التحكم</h1><p class="muted">إدارة منتجات المتجر — نسخة تجريبية محلية.</p>
<section class="admin-grid"><div class="admin-card">المنتجات<strong id="statProducts">0</strong></div><div class="admin-card">طلبات تجريبية<strong id="statOrders">0</strong></div><div class="admin-card">قيمة السلة الحالية<strong id="statCart">0 دج</strong></div></section>
<form id="productForm" class="admin-form"><h2>إضافة منتج</h2><label>اسم المنتج</label><input id="name" required><label>الوصف</label><textarea id="desc" required></textarea><label>السعر بالدينار</label><input id="price" type="number" min="0" required><label>التصنيف</label><select id="cat"><option value="prompts">Prompts</option><option value="templates">Templates</option><option value="kits">Kits</option><option value="tools">Tools</option></select><label>الأيقونة</label><input id="icon" value="📦" maxlength="4"><button class="primary" type="submit">إضافة المنتج</button></form>
<section class="admin-form admin-list"><h2>المنتجات الحالية</h2><div id="productList"></div></section></main>
<script src="admin.js"></script>
</body></html>
