<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DZD Store — Admin</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1100px;margin:30px auto;padding:0 16px}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.admin-card,.admin-form{background:#fff;border:1px solid #e7e7e7;border-radius:16px;padding:20px;box-shadow:0 8px 24px #00000008}.admin-card strong{font-size:28px;display:block;margin-top:8px}.admin-form{margin-top:20px}.admin-form label{display:block;margin:12px 0 6px;font-weight:700}.admin-form input,.admin-form select,.admin-form textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit;box-sizing:border-box}.admin-form button{margin-top:16px;padding:12px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:700}.admin-list{margin-top:20px}.admin-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#ffe9e9;color:#a00}.primary{background:#111;color:#fff}.muted{color:#777}.order{border:1px solid #eee;border-radius:12px;padding:14px;margin:10px 0}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.status{font-weight:700}.status.PENDING{color:#9a6700}.status.PAID{color:#087f23}.status.CANCELLED,.status.FAILED{color:#a00}.hidden{display:none!important}.notice{padding:12px;border-radius:10px;background:#f5f5f5;margin-top:12px}.logout{float:left}.filebox{padding:14px;border:1px dashed #bbb;border-radius:12px;background:#fafafa}.filehint{font-size:13px;color:#666;margin-top:6px}</style></head><body><header class="header"><div class="container nav"><a class="logo" href="index.html">DZD<span>Store</span></a><a href="index.html">← المتجر</a></div></header><main class="admin"><div id="loginBox" class="admin-form"><h1>دخول لوحة الإدارة</h1><p class="muted">سجّل الدخول بحساب Supabase المخصص للإدارة.</p><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" class="primary" type="button">دخول</button><button id="claimBtn" type="button">تفعيل هذا الحساب كأول مدير</button><div id="loginMsg" class="notice hidden"></div></div><div id="panel" class="hidden"><button id="logoutBtn" class="logout">تسجيل الخروج</button><h1>لوحة التحكم</h1><p class="muted">إدارة المنتجات والطلبات مرتبطة مباشرة بـ Supabase.</p><section class="admin-grid"><div class="admin-card">المنتجات<strong id="statProducts">0</strong></div><div class="admin-card">الطلبات<strong id="statOrders">0</strong></div></section><form id="productForm" class="admin-form"><h2 id="formTitle">إضافة منتج</h2><input id="editId" type="hidden"><label>اسم المنتج</label><input id="name" required><label>الوصف</label><textarea id="desc" required></textarea><label>السعر بالدينار</label><input id="price" type="number" min="1" required><label>التصنيف</label><select id="cat"><option value="prompts">Prompts</option><option value="templates">Templates</option><option value="kits">Kits</option><option value="tools">Tools</option></select><label>الأيقونة</label><input id="icon" value="📦" maxlength="4"><div class="filebox"><label>📁 ملف المنتج الرقمي</label><input id="productFile" type="file" accept=".zip,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt,.epub"><div class="filehint">ارفع الملف الذي سيحصل عليه الزبون بعد الدفع. يبقى داخل Storage الخاص ولا يظهر للعموم.</div><div id="currentFile" class="filehint"></div></div><label>حد التحميلات</label><input id="downloadLimit" type="number" min="1" value="5"><label><input id="active" type="checkbox" checked> المنتج ظاهر في المتجر</label><div class="actions"><button class="primary" type="submit">حفظ المنتج والملف</button><button id="cancelEdit" type="button">إلغاء</button></div></form><section class="admin-form admin-list"><h2>المنتجات الحالية</h2><div id="productList"></div></section><section class="admin-form admin-list"><h2>الطلبات</h2><div id="ordersList"></div></section></div></main><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
